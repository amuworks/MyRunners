name: check
on:
  schedule:
    - cron: "0 22 * * *"   # 毎日朝7時(日本時間)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "update status"
          git push
